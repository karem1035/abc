services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abc}
      POSTGRES_DB: ${POSTGRES_DB:-abc}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abc} -d ${POSTGRES_DB:-abc}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:-rustfsadmin}
      RUSTFS_CONSOLE: "false"
    ports:
      - "9000:9000"
    volumes:
      - rustfsdata:/data

  createbuckets:
    image: minio/mc
    depends_on:
      - rustfs
    entrypoint:
      - /bin/sh
      - -c
      - |
        sleep 3;
        until mc alias set local http://rustfs:9000 ${RUSTFS_ROOT_USER:-rustfsadmin} ${RUSTFS_ROOT_PASSWORD:-rustfsadmin} --api S3v4; do sleep 2; done;
        mc mb --ignore-existing local/${RUSTFS_BUCKET:-abc-public};
        mc anonymous set download local/${RUSTFS_BUCKET:-abc-public};
        exit 0;

volumes:
  pgdata:
  rustfsdata:
